services:
  - type: web
    name: taxi-seniran-aibd-api
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet --workers 1 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taxi-seniran-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_NAME
        value: Administrateur TAXI SENIRAN AIBD
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: demo
      - key: PAYMENT_MODE
        value: sandbox
      - key: PAYMENT_WEBHOOK_VERIFY
        value: "false"

databases:
  - name: taxi-seniran-db
    plan: free
    region: frankfurt
    databaseName: taxi_seniran
    user: taxi_seniran
